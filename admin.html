<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">

<title>Admin | ORIZA ART</title>
<link rel="stylesheet" href="css/admin.css">

</head>
<body>

<div id="login-vista" class="login-vista">
    <form id="login-form" class="login-form">
        <h1>ORIZA ART</h1>
        <p>Panel de administración</p>
        <input type="password" id="login-password" placeholder="Contraseña" required autofocus>
        <button type="submit">Entrar</button>
        <p id="login-error" class="login-error" hidden></p>
    </form>
</div>

<div id="loader-vista" hidden>
    <div class="loader-box">
        <div class="loader-spinner"></div>
        <h2>Cargando panel...</h2>
        <p>Obteniendo productos desde la base de datos</p>
    </div>
</div>

<div id="panel-vista" hidden>

    <header class="admin-header">
        <h1>ORIZA ART · Admin</h1>
        <div class="admin-header-acciones">
            <button id="btn-nuevo" class="btn-primario">+ Nuevo producto</button>
            <button id="btn-cerrar-sesion" class="btn-secundario">Cerrar sesión</button>
        </div>
    </header>

<div class="barra-herramientas">

    <input
        id="buscar-producto"
        type="text"
        placeholder="🔍 Buscar por nombre o ID">

    <select id="filtro-tipo">

        <option value="">Todos</option>
        <option value="PULSERA">Pulseras</option>
        <option value="COLLAR">Collares</option>

    </select>

    <select id="filtro-estado">

        <option value="">Todos</option>
        <option value="ACTIVO">Activos</option>
        <option value="INACTIVO">Inactivos</option>

    </select>

</div>

    <main class="admin-main">
        <div class="tabla-wrap">
            <table class="tabla-admin">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-productos"></tbody>
            </table>
        </div>
    </main>

</div>

<div id="form-overlay" class="form-overlay" hidden>
    <form id="form-producto" class="form-producto">

    <div class="form-layout">

        <div class="form-col">

            <div class="form-header">
                <h2 id="form-titulo">Nuevo producto</h2>
                <button type="button" id="form-cerrar" aria-label="Cerrar">✕</button>
            </div>

            <label>
                <span>ID (único, ej. ES-PU-003)</span>
                <input type="text" id="f-id" required>
            </label>

            <label>
                <span>Tipo</span>
                <select id="f-tipo">
                    <option value="PULSERA">Pulsera</option>
                    <option value="COLLAR">Collar</option>
                </select>
            </label>

            <label>
                <span>Nombre</span>
                <input type="text" id="f-nombre" required>
            </label>

            <label>
                <span>Precio (S/)</span>
                <input type="number" id="f-precio" step="0.10" min="0" required>
            </label>

            <label>
                <span>Material</span>
                <input type="text" id="f-material" placeholder="Separado por comas">
            </label>

            <label>
                <span>Descripción</span>
                <textarea id="f-descripcion" rows="3"></textarea>
            </label>

            <label>
                <span>Imagen (URL, opcional)</span>
                <input type="text" id="f-imagen" placeholder="https://...">
                <small>Sube tu foto a imgbb.com o Drive y pega el link. Vacío = usa la imagen ya existente según el ID.</small>
            </label>

            <label>
                <span>Estado</span>
                <select id="f-estado">
                    <option value="ACTIVO">Activo</option>
                    <option value="INACTIVO">Inactivo</option>
                </select>
            </label>

            <label>
                <span>Destacado</span>
                <select id="f-destacado">
                    <option value="NO">No</option>
                    <option value="SI">Sí</option>
                </select>
            </label>

            <label>
                <span>Orden</span>
                <input type="number" id="f-orden" min="1">
            </label>

            <label>
                <span>Stock</span>
                <input type="number" id="f-stock" min="0" required>
            </label>

        </div>

            <div class="preview-col">

                <div class="preview-admin">

                <div class="preview-card">

    <div class="preview-imagen">

        <img id="preview-img"
             src="img/no-image.webp"
             alt="Producto">

        <span id="preview-tipo" class="preview-badge">
            PULSERA
        </span>

        <span id="preview-destacado"
              class="preview-star"
              hidden>
            ⭐ Destacado
        </span>

    </div>

    <div class="preview-info">

        <h2 id="preview-nombre">
            Nombre del producto
        </h2>

        <div id="preview-precio"
             class="preview-precio">
            S/ 0.00
        </div>

        <div id="preview-stock"
             class="preview-stock disponible">
            Disponible
        </div>

        <div id="preview-material"
             class="preview-material">
            Material
        </div>

        <p id="preview-descripcion"
           class="preview-descripcion">

            Descripción...

        </p>

        <div class="preview-botones">

            <button
                class="btn-preview-carrito"
                type="button">

                🛒 Agregar al carrito

            </button>

            <button
                class="btn-preview-whatsapp"
                type="button">

                💬 Consultar por WhatsApp

            </button>

        </div>

    </div>

</div>

            </div>
            
        </div>

    </div>
        <button type="submit" class="btn-primario">Guardar</button>

    </form>
</div>

<div id="toast"></div>

<script src="js/admin.js"></script>
</body>
</html>
